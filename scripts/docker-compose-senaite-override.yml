services:
  senaite:
    image: mekomsolutions/senaite
    environment:
      - SENAITE_SAMPLES_ACTIVE_EXCLUDE_VERIFIED=${SENAITE_SAMPLES_ACTIVE_EXCLUDE_VERIFIED}
      - SENAITE_SKIP_PDF=${SENAITE_SKIP_PDF}
      - ZODB_CACHE_SIZE=${ZODB_CACHE_SIZE}
      - WSGI_THREADS=${WSGI_THREADS}
      - ZEO_CLIENT_CACHE_SIZE=${ZEO_CLIENT_CACHE_SIZE}
      - BUILDOUT_SKIP_IF_UNCHANGED=${BUILDOUT_SKIP_IF_UNCHANGED}
      - RELSTORAGE_CACHE_LOCAL_MB=${RELSTORAGE_CACHE_LOCAL_MB:-10}
